<html>
<head>
  <link href='http://fonts.googleapis.com/css?family=Roboto:400,300,100,500&subset=latin,latin-ext' rel='stylesheet'/>
  <link rel="stylesheet" type="text/css" href="cube.css">
  <link rel="stylesheet" type="text/css" href="game.css">
  <style>
  #ui{
    font-family: 'Roboto',sans-serif;
    position:absolute;
    top: 0px;
    left: 0px;
    z-index: 10000;
    width: 100%;
  }
  #ui > .ui{
    display: block;
    box-sizing: border-box;
    padding: 16px;
    width: 250px;
    height: 250px;
    background-color: #EAEAEA;
  }
  #ui  h2{
    font-weight: 100;
  }
  #ui>.uileft{
    position:absolute;
    top: 0px;
    left: 0px;
  }
  #ui>.uiright{
    position:absolute;
    top: 0px;
    right: 0px;
  }
  .score{
    font-size: 24px;
    padding: 16px;
    color: #09F;
  }
  </style>
</head>
<body>dddd
  <div id="ui">
    <div id="ui-left" class="ui uileft">
      <header><h2>Player Name</h2></header>
      <div>score:
      <span id="score-one" class="score">0</span>
      </div>
      </div>
    <div id="ui-right" class="ui uiright">
    <header><h2>Player Name</h2></header>
    <div>score:<span id="score-two" class="score">0</span></div>
  </div>
  </div>
  <div id="gamewrap">
    <div id="game"></div>
  </div>
</body>
<script>
function _(id){ return document.getElementById(id); };
function _make(tag, oClass){ el = document.createElement(tag); el.className = oClass; return el; };

var GAMEAPP = GAMEAPP || {};

GAMEAPP.data = {
  map:{
    size:{rows:9,columns:9},
    squares:54
  },
  player:{
    one:{nr:1, name:'default name', score:0, pStyle:'playerOne', scoreDiv: _('score-one') },
    two:{nr:2, name:'default name', score:0, pStyle:'playerTwo', scoreDiv: _('score-two') }
  },
  cubes:[]
};

GAMEAPP.tmp = {
  selected: {
    square:'',
    x:'',
    y:''},
  previous: '',
  player: GAMEAPP.data.player.one,
  glow:[]
}

GAMEAPP.part = {
  tile: function(x,y){
    this.x = x;
    this.y = y;
    this.z = '';
    this.oBoxes = 0;
  },
  cube: function(){
    this.box = _make('div', 'cube');
    this.topSide = _make('div', 'top');
    this.bottomSide = _make('div', 'front');
    this.backSide = _make('div', 'back');
    this.frontSide = _make('div', 'left');
    this.rightSide = _make('div', 'right');
    this.leftSide = _make('div', 'bottom');

    this.box.appendChild(this.topSide);
    this.box.appendChild(this.bottomSide);
    this.box.appendChild(this.leftSide);
    this.box.appendChild(this.rightSide);
    this.box.appendChild(this.backSide);
    this.box.appendChild(this.frontSide);
    //this.topSide.addEventListener('click',this.placeBoxSides.bind(this),false);
  },
  grass: function(){ this.el = _make('div', 'grass'); }
}
GAMEAPP.endTurn = function(){
  if(GAMEAPP.tmp.player.nr == 1){ GAMEAPP.tmp.player = GAMEAPP.data.player.two;}
  else{ GAMEAPP.tmp.player = GAMEAPP.data.player.one; }
}
GAMEAPP.placeCube = function(e){
    // check if left click
    if(e.which == 1){
    game.removeEventListener('click',GAMEAPP.placeCube,false);
    if(GAMEAPP.tmp.selected.square.placed){}
    else
    {
      game.removeEventListener('click',GAMEAPP.placeCube,false);
      var selected = GAMEAPP.tmp.selected;
      var placedCube = new GAMEAPP.part.cube();
      selected.square.appendChild(placedCube.box);
      selected.square.cube = placedCube;
      placedCube.box.classList.add(GAMEAPP.tmp.player.pStyle)
      selected.square.placed = true;
      selected.square.player = GAMEAPP.tmp.player;
      GAMEAPP.countPoints();
      placedCube.box.setAttribute('style','transform: translateZ(605px);');
      setTimeout(function(){
      placedCube.box.removeAttribute('style');
    },100);
      selected.square.removeEventListener('click',GAMEAPP.placeCube,false);

    GAMEAPP.endTurn();
    setTimeout(function(){
      var arr = GAMEAPP.tmp.glow;
      var len = arr.length;
      for(i=0;i<len;i++){
          arr[i].classList.remove('scored');
      }
    },1000);
    }
    game.addEventListener('click',GAMEAPP.placeCube,false);
}
}
GAMEAPP.countPoints = function(){

  var col = GAMEAPP.tmp.selected.x;
  var row = GAMEAPP.tmp.selected.y;
  var ply = GAMEAPP.tmp.selected.square.player;

  var check = function(r, c){
    nrow = row + r;
    ncol = col + c;
    sqr = GAMEAPP.data.cubes[nrow][ncol].square;
    if(sqr.placed){
      nplayer = sqr.player;
      if(nplayer === ply){ return true; }
    }
  }
  selectScored = function(r,c){
    nrow = row + r;
    ncol = col + c;
    console.log(nrow+'--'+ncol);
    el = GAMEAPP.data.cubes[nrow][ncol].square.cube.box;
    console.log(el);
    el.classList.add('scored');
    GAMEAPP.tmp.glow.push(el);
  }

  //  [2, -2]         [2, 0]        [2, 2]
  //          [1, -1] [1, 0] [1, 1]
  //  [0, -2] [0, -1] [0, 0] [0, 1] [0, 2]
  //          [-1,-1] [-1,0] [-1,1]
  //  [-2,-2]         [-2,0]        [-2,2]
  var score = GAMEAPP.tmp.player.score;

  if(col>1){
  // close points left
  if(row>1){ if(check(-1,-1) && check(-2,-2)){ score++; selectScored(-1,-1); selectScored(-2,-2);selectScored(0,0) }}
  if(row<7){ if(check(1,-1) && check(2,-2)){ score++; selectScored(1,-1);selectScored(2,-2);selectScored(0,0) }}
  if(check(0,-1) && check(0,-2)){ score++; selectScored(0,-1); selectScored(0,-2); selectScored(0,0) }
  }
  if(col<7){
  // close points right
  if(row<7){ if(check(1,1) && check(2,2)){ score++ ; selectScored(1,1); selectScored(2,2); selectScored(0,0)}}
  if(row>1){ if(check(-1,1) && check(-2,2)){ score++ ; selectScored(-1,1); selectScored(-2,2); selectScored(0,0) }}
  if(check(0,1) && check(0,2)){ score++ ; selectScored(0,1); selectScored(0,2); selectScored(0,0) }
  }
  // up and down
  if(row<7){if(check(1,0) && check(2,0)){ score++ ; selectScored(1,0); selectScored(2,0); selectScored(0,0) }}
  if(row>1){if(check(-1,0) && check(-2,0)){ score++ ; selectScored(-1,0); selectScored(-2,0); selectScored(0,0) }}
  // is middle of
  if(col>0 && col<8){if(check(0,-1) && check(0,1)){ score++ ; selectScored(0,-1); selectScored(0,1); selectScored(0,0)}}
  if(row>0 && row<8){if(check(1,0) && check(-1,0)){ score++ ; selectScored(1,0); selectScored(-1,0); selectScored(0,0)}}
  if(col>0 && col<8 && row>0 && row<8){
    //diagonal middle
    if(check(-1,-1) && check(1,1)){ score++; selectScored(-1,-1); selectScored(1,1); selectScored(0,0) }
    if(check(1,-1) && check(-1,1)){ score++; selectScored(1,-1); selectScored(-1,1); selectScored(0,0) }
  }
  GAMEAPP.tmp.player.scoreDiv.innerHTML = score;
  GAMEAPP.tmp.player.score = score;
}
// storing squares to gird
var gamewrap = _('gamewrap');
var game = _('game');
var score_one = _('score-one')

var gamedata = gamedata || {}


GAMEAPP.part.cube.prototype.placeBoxSides = function(e){
  if(this.topSide.placed){}
  else
  {  console.log('s');
  var self = this;
  var a = new gamedata.userBox();
  this.topSide.appendChild(a.box);
  a.box.setAttribute('style','transform: translateZ(605px);');
  this.topSide.placed = true;
  setTimeout(function(){
  a.box.removeAttribute('style');
  self.topSide.removeEventListener('click',gamedata.userBox.placeBoxSides,false);
},200);}
}

GAMEAPP.part.tile.prototype._init = function(){
  this.square = _make('div','square');
  game.appendChild(this.square);
  this.square.style.top = this.y * GAMEAPP.data.map.squares;
  this.square.style.left = this.x * GAMEAPP.data.map.squares;
  this.square.addEventListener('mouseover',this.highlight.bind(this),false);
}

GAMEAPP.part.tile.prototype.highlight = function(){
  if(GAMEAPP.tmp.previous != ''){
  GAMEAPP.tmp.previous.style.background = 'none';
  }
  GAMEAPP.tmp.selected.x = this.x;
  GAMEAPP.tmp.selected.y = this.y;
  GAMEAPP.tmp.selected.square = this.square;
  this.square.style.backgroundImage = 'url("glow.png")';
  this.square.style.backgroundSize = 'contain';
  this.square.style.backgroundRepeat = 'no-repeat';
  GAMEAPP.tmp.previous = this.square;
}

for(i=0;i < GAMEAPP.data.map.size.rows; i++){
  GAMEAPP.data.cubes[i] = [];
  for(j=0; j < GAMEAPP.data.map.size.columns; j++){
    var square = new GAMEAPP.part.tile(j,i);
    square._init();
    GAMEAPP.data.cubes[i].push(square);
  }
}

var mouse = { x:'',y:'',}
var camera = {degX:54, degY:-29}
var camera_new = {degX:'',degY:''}

gamedata.updateCamera = function(){
  valueX = mouse.x - event.clientX;
  valueY = mouse.y - event.clientY;


  camera_new.degX = camera.degX + valueY;
  camera_new.degY = camera.degY + valueX;

  if(camera_new.degX > 90){x = 90;}
  else if(camera_new.degX < 18){x = 18}
  else{ x = camera_new.degX;}
  if(camera_new.degY > 45){y = 45;}
  else if(camera_new.degY < -45){y = -45}
  else{ y = camera_new.degY;}
  gamewrap.setAttribute('style','transform:perspective('+(650)+'px) rotateX('+x+'deg)  rotateZ('+y+'deg);');
  camera_new.degX = x;
  camera_new.degY = y;
}
gamedata.endCameraMovement = function(){
  window.removeEventListener('mousemove',gamedata.updateCamera,false);

  camera.degX = camera_new.degX;
  camera.degY = camera_new.degY;
}

document.addEventListener('mousedown',function(event){
  if(event.which == 2){
  mouse.x = event.clientX;
  mouse.y = event.clientY;
  window.addEventListener('mousemove',gamedata.updateCamera,false);
  window.addEventListener('mouseup',gamedata.endCameraMovement,false);
  };
},false);

game.addEventListener('click',GAMEAPP.placeCube,false);

</script>

</html>
