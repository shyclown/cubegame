<!DOCTYPE html>
<html>
<head>
  <link href='https://fonts.googleapis.com/css?family=Roboto:400,300,100,500&subset=latin,latin-ext' rel='stylesheet'/>
  <link rel="stylesheet" type="text/css" href="cube.css">
  <link rel="stylesheet" type="text/css" href="game.css">
  <link rel="stylesheet" type="text/css" href="ui.css">

</head>
<body>
<div id="ui">
  <div id="ui-left" class="ui uileft">
    <header><h2>Player One</h2></header>
    <div>score:
      <span id="score-one" class="score">0</span>
    </div>
  </div>
  <div id="ui-right" class="ui uiright">
    <header><h2>Player Two</h2></header>
    <div>score:<span id="score-two" class="score">0</span></div>
  </div>
</div>
<div id="gamewrap">
  <div id="game"></div>
</div>
</body>
<script>
  /**
   * Utility Helper Class
   */
  class DomUtils {
    static get(id) { return document.getElementById(id); }

    static make(tag, className) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      return el;
    }
  }

  /**
   * Game Configuration & Data State
   */
  class GameConfig {
    constructor() {
      this.map = Array(9).fill().map(() => Array(9).fill(1));
      this.boxSize = 54;
      this.players = {
        1: { name: 'Player One', score: 0, color: '#000' },
        2: { name: 'Player Two', score: 0, color: '#444' }
      };
      this.dom = {
        wrap: DomUtils.get('gamewrap'),
        game: DomUtils.get('game'),
        scoreOne: DomUtils.get('score-one')
      };
    }
  }

  /**
   * Main Game Controller
   */
  class GameEngine {
    constructor() {
      this.config = new GameConfig();
      this.grid = [];
      this.currentPlayer = 1;
      this.prevSelected = null;
      this.selected = { square: null, x: 0, y: 0 };

      this.camera = { degX: 54, degY: -29 };
      this.mouse = { x: 0, y: 0 };

      // Optimization: Track the "target" rotation separately from "current"
      this.targetX = 54;
      this.targetY = -29;
      this.ticking = false;

      this.init();
    }

    init() {
      const rows = this.config.map.length;
      const cols = this.config.map[0].length;

      // Build the grid based on the map
      for (let i = 0; i < rows; i++) {
        this.grid[i] = [];
        for (let j = 0; j < cols; j++) {
          const tile = new Tile(j, i, this.config.boxSize, this);
          this.grid[i].push(tile);
        }
      }

      // Global Listeners
      document.addEventListener('mousedown', (e) => this.onMouseDown(e));
      this.config.dom.game.addEventListener('click', () => this.placeBox());
    }

    placeBox() {
      const target = this.selected.square;
      if (!target || target.placed) return;

      const userB = new UserBox(this);
      target.appendChild(userB.el);

      target.placed = true;
      target.player = this.currentPlayer;

      const pointsBefore = this.config.players[this.currentPlayer].score;
      this.checkPoints();

      // If they scored, trigger the temporary highlight
      if (this.config.players[this.currentPlayer].score > pointsBefore) {
        userB.flashScored();
      }

      // Standard drop animation
      userB.el.style.transform = 'translateZ(200px) rotateX(-90deg) translateZ(-52px)';
      setTimeout(() => {
        userB.el.style.transform = '';
      }, 200);

      this.switchPlayer();
    }

    switchPlayer() {
      this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;

      // Optional: Update UI to show who's turn it is
      const turnIndicator = document.getElementById('current-turn');
      if (turnIndicator) {
        turnIndicator.innerText = `Turn: Player ${this.currentPlayer}`;
        turnIndicator.className = this.currentPlayer === 1 ? 'playerOneText' : 'playerTwoText';
      }

      console.log(`Current Player is now: ${this.currentPlayer}`);
    }

    checkPoints() {
      const { x: col, y: row } = this.selected;
      const ply = this.currentPlayer;
      const rows = this.grid.length;
      const cols = this.grid[0].length;

      const check = (r, c) => {
        const nRow = row + r;
        const nCol = col + c;
        if (nRow < 0 || nRow >= rows || nCol < 0 || nCol >= cols) return false;

        const sqr = this.grid[nRow][nCol].element;
        sqr.style.backgroundColor = this.config.players[ply].color;
        return sqr.placed && sqr.player === ply;
      };

      // Scoring Patterns
      const patterns = [
        () => col > 1 && ((row > 1 && check(-1, -1) && check(-2, -2)) || (row < 7 && check(1, -1) && check(2, -2)) || (check(0, -1) && check(0, -2))),
        () => col < 7 && ((row < 7 && check(1, 1) && check(2, 2)) || (row > 1 && check(-1, 1) && check(2, 2)) || (check(0, 1) && check(0, 2))),
        () => row < 7 && check(1, 0) && check(2, 0),
        () => row > 1 && check(-1, 0) && check(-2, 0),
        () => col > 0 && col < 8 && check(0, -1) && check(0, 1),
        () => row > 0 && row < 8 && check(1, 0) && check(-1, 0),
        () => col > 0 && col < 8 && row > 0 && row < 8 && ((check(-1, -1) && check(1, 1)) || (check(1, -1) && check(-1, 1)))
      ];

      patterns.forEach(p => {
        if(p()) this.config.players[ply].score++;
      });

      this.updateUI();
    }

    updateUI() {
      if (this.config.dom.scoreOne) {
        this.config.dom.scoreOne.innerHTML = this.config.players[1].score;
      }
    }

    onMouseDown(e) {
      if (e.which === 2) {
        this.mouse.x = e.clientX;
        this.mouse.y = e.clientY;

        // Use bind for consistent references
        this._moveHandler = (ev) => this.handleMouseMove(ev);
        this._upHandler = () => this.stopCameraMovement();

        window.addEventListener('mousemove', this._moveHandler);
        window.addEventListener('mouseup', this._upHandler);
      }
    }

    handleMouseMove(e) {
      // 1. Just update the target values (Very fast)
      let valX = this.mouse.x - e.clientX;
      let valY = this.mouse.y - e.clientY;

      this.targetX = Math.min(Math.max(this.camera.degX + valY, 18), 90);
      this.targetY = Math.min(Math.max(this.camera.degY + valX, -45), 45);

      // 2. Request a frame update if one isn't already scheduled
      if (!this.ticking) {
        requestAnimationFrame(() => this.updateCameraFrame());
        this.ticking = true;
      }
    }

    updateCameraFrame() {
      // 3. Perform the actual DOM/CSS update here (Once per frame)
      this.config.dom.wrap.style.transform = `rotateX(${this.targetX}deg) rotateZ(${this.targetY}deg)`;
      this.ticking = false;
    }

    stopCameraMovement() {
      window.removeEventListener('mousemove', this._moveHandler);
      window.removeEventListener('mouseup', this._upHandler);

      // Save the final position
      this.camera.degX = this.targetX;
      this.camera.degY = this.targetY;
    }
  }

  /**
   * Individual Grid Tile
   */
  class Tile {
    constructor(x, y, size, manager) {
      this.x = x;
      this.y = y;
      this.manager = manager;
      this.element = DomUtils.make('div', 'square');

      this.element.style.top = `${y * size}px`;
      this.element.style.left = `${x * size}px`;

      this.element.addEventListener('mouseover', () => this.highlight());
      this.manager.config.dom.game.appendChild(this.element);
    }

    highlight() {
      if (this.manager.prevSelected) {
        this.manager.prevSelected.style.backgroundImage = 'none';
      }

      this.manager.selected = { x: this.x, y: this.y, square: this.element };
      this.element.style.backgroundImage = 'url("glow.png")';
      this.element.style.backgroundSize = 'contain';
      this.element.style.backgroundRepeat = 'no-repeat';

      this.manager.prevSelected = this.element;
    }
  }

  /**
   * The 3D Cube
   */
  class UserBox {
    constructor(manager) {
      this.manager = manager;
      this.el = DomUtils.make('div', 'cube');

      // Set permanent player skin
      const playerClass = this.manager.currentPlayer === 1 ? 'playerOne' : 'playerTwo';
      this.el.classList.add(playerClass);

      const sides = ['top', 'front', 'back', 'left', 'right', 'bottom'];
      this.sideElements = {};

      sides.forEach(side => {
        const sideEl = DomUtils.make('div', side);
        this.sideElements[side] = sideEl;
        this.el.appendChild(sideEl);
      });

      this.sideElements.top.addEventListener('click', (e) => {
        e.stopPropagation();
        this.stackCube();
      });
    }

    // New Highlight Method
    flashScored() {
      this.el.classList.add('scored');

      // Remove the class after 1 second (or match your transition time)
      setTimeout(() => {
        this.el.classList.remove('scored');
      }, 1000);
    }

    stackCube() {
      if (this.sideElements.top.placed) return;

      const nextBox = new UserBox(this.manager);
      this.sideElements.top.appendChild(nextBox.el);

      nextBox.el.style.transform = 'translateZ(52px) rotateX(-90deg) translateZ(-52px)';
      this.sideElements.top.placed = true;

      // Check if stacking scores a point
      const pointsBefore = this.manager.config.players[this.manager.currentPlayer].score;
      this.manager.checkPoints();
      if (this.manager.config.players[this.manager.currentPlayer].score > pointsBefore) {
        nextBox.flashScored();
      }

      setTimeout(() => {
        nextBox.el.style.transform = '';
      }, 200);

      this.manager.switchPlayer();
    }
  }

  // Start Application
  const app = new GameEngine();

</script>

</html>
