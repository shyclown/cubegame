<!DOCTYPE html>
<html>
<head>
  <link href='https://fonts.googleapis.com/css?family=Roboto:400,300,100,500&subset=latin,latin-ext' rel='stylesheet'/>
  <link rel="stylesheet" type="text/css" href="cube.css">
  <link rel="stylesheet" type="text/css" href="game.css">
  <link rel="stylesheet" type="text/css" href="ui.css">
</head>
<body>
<div id="ui">
  <div id="ui-left" class="ui uileft">
    <header><h2>Player One</h2></header>
    <div>score:
      <span id="score-one" class="score">0</span>
    </div>
  </div>
  <div id="ui-right" class="ui uiright">
    <header><h2>Player Two</h2></header>
    <div>score:<span id="score-two" class="score">0</span></div>
  </div>
</div>
<div id="gamewrap" >
  <div id="game"></div>
</div>
<div id="game-messages"></div>
</body>
<script>
  /**
   * Utility Helpers
   */
  class DomUtils {
    static get(id) { return document.getElementById(id); }
    static make(tag, className) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      return el;
    }
  }

  class GameBot {
    constructor(manager, playerId) {
      this.manager = manager;
      this.playerId = playerId;
    }

    takeTurn() {
      const moves = this.getAvailableMoves();
      if (moves.length === 0) return;

      // Sort moves: highest score first
      moves.sort((a, b) => b.score - a.score);

      // Pick from the top-tier moves (adds slight variety so it's not 100% predictable)
      const topScore = moves[0].score;
      const bestMoves = moves.filter(m => m.score === topScore);
      const finalMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];

      setTimeout(() => {
        // Highlight the tile for visual feedback before "clicking"
        finalMove.tile.highlight();
        this.manager.placeBox();
      }, 1000);
    }

    getAvailableMoves() {
      const scoredMoves = [];
      for (let r = 0; r < this.manager.config.rows; r++) {
        for (let c = 0; c < this.manager.config.cols; c++) {
          const tile = this.manager.grid[r][c];
          if (!tile.element.placed) {
            scoredMoves.push({
              r, c, tile,
              score: this.calculateTileWeight(r, c)
            });
          }
        }
      }
      return scoredMoves;
    }

    calculateTileWeight(row, col) {
      let weight = 0;

      // Check all 8 directions around the tile
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;

          const nr = row + dr;
          const nc = col + dc;

          // Ensure we stay within the 9x9 grid boundaries
          if (nr >= 0 && nr < this.manager.config.rows && nc >= 0 && nc < this.manager.config.cols) {
            const neighbor = this.manager.grid[nr][nc].element;

            if (neighbor.placed) {
              if (neighbor.player === this.playerId) {
                weight += 10; // High preference for own clusters
              } else {
                weight += 5;  // Moderate preference for blocking/proximity to player
              }
            }
          }
        }
      }
      return weight;
    }
  }

  /**
   * Configuration and State
   */
  class GameConfig {
    constructor() {
      this.boxSize = 54;
      this.rows = 9;
      this.cols = 9;
      this.players = {
        1: { name: 'Player One', score: 0, class: 'playerOne' },
        2: { name: 'Player Two', score: 0, class: 'playerTwo' }
      };
      this.dom = {
        wrap: DomUtils.get('gamewrap'),
        game: DomUtils.get('game'),
        scoreOne: DomUtils.get('score-one'),
        scoreTwo: DomUtils.get('score-two'),
        msgBox: DomUtils.get('game-messages')
      };
    }
  }

  /**
   * Individual Grid Tile
   */
  class Tile {
    constructor(x, y, size, manager) {
      this.x = x;
      this.y = y;
      this.manager = manager;
      this.currentCube = null; // Stores UserBox instance
      this.element = DomUtils.make('div', 'square');

      this.element.style.top = `${y * size}px`;
      this.element.style.left = `${x * size}px`;

      this.element.addEventListener('mouseover', () => this.highlight());
      this.manager.config.dom.game.appendChild(this.element);
    }

    highlight() {
      if (this.manager.prevSelectedTile) {
        this.manager.prevSelectedTile.element.style.backgroundImage = 'none';
      }
      this.manager.selected = { x: this.x, y: this.y, tile: this };
      this.element.style.backgroundImage = 'url("glow.png")';
      this.element.style.backgroundSize = 'contain';
      this.element.style.backgroundRepeat = 'no-repeat';
      this.manager.prevSelectedTile = this;
    }
  }

  /**
   * 3D Cube Component
   */
  class UserBox {
    constructor(manager) {
      this.manager = manager;
      this.el = DomUtils.make('div', 'cube');
      this.el.classList.add(this.manager.config.players[this.manager.currentPlayer].class);

      const sides = ['top', 'front', 'back', 'left', 'right', 'bottom'];
      this.sideElements = {};

      sides.forEach(side => {
        const sideEl = DomUtils.make('div', side);
        this.sideElements[side] = sideEl;
        this.el.appendChild(sideEl);
      });

      this.sideElements.top.addEventListener('click', (e) => {
        e.stopPropagation();
        this.stackCube();
      });
    }

    flashScored() {
      this.el.classList.add('scored');
      setTimeout(() => this.el.classList.remove('scored'), 1000);
    }

    stackCube() {
      if (this.sideElements.top.placed) return;
      this.manager.placeBox(this.sideElements.top);
    }
  }

  /**
   * Main Game Engine
   */
  class GameEngine {
    constructor() {
      this.config = new GameConfig();
      this.grid = [];
      this.currentPlayer = 1;
      this.selected = { x: 0, y: 0, tile: null };
      this.prevSelectedTile = null;

      // Camera Optimization State
      this.camera = { degX: 54, degY: -29 };
      this.mouse = { x: 0, y: 0 };
      this.targetX = 54;
      this.targetY = -29;
      this.ticking = false;

      this.bot = new GameBot(this, 2); // Player 2 is the bot
      this.isBotEnabled = true;

      this.init();
    }

    init() {
      for (let i = 0; i < this.config.rows; i++) {
        this.grid[i] = [];
        for (let j = 0; j < this.config.cols; j++) {
          this.grid[i].push(new Tile(j, i, this.config.boxSize, this));
        }
      }

      document.addEventListener('mousedown', (e) => this.onMouseDown(e));
      this.config.dom.game.addEventListener('click', () => this.placeBox());
    }
    notify(text, isCombo = false) {
      const msg = DomUtils.make('div', 'game-notification');
      msg.innerText = text;
      if (isCombo) msg.classList.add('combo-text');

      this.config.dom.msgBox.appendChild(msg);

      // Auto-remove after animation
      setTimeout(() => msg.remove(), 2000);
    }

    placeBox(targetParent = null) {
    // Use the tile selected by either mouseover OR the bot logic
      const tile = this.selected.tile;
      if (!tile) return;

      // Don't let the bot place on an occupied tile (and vice-versa)
      if (targetParent === null && tile.element.placed) return;

      const parent = targetParent || tile.element;
      const userB = new UserBox(this);
      const currentPlayerName = this.config.players[this.currentPlayer].name;

      parent.appendChild(userB.el);
      parent.placed = true;
      parent.player = this.currentPlayer;

      if (!targetParent) tile.currentCube = userB;

      const winners = this.checkPoints();

      // 1. Handle Scoring Notifications
      if (winners.length > 0) {
        const pointsFound = winners.length / 2; // Patterns of 3 use 2 contributors + 1 placed
        if (pointsFound > 1) {
          this.notify(`${pointsFound}x COMBO!`, true);
        } else {
          this.notify("+1 Point!");
        }
      }

      userB.el.style.transform = 'translateZ(200px) rotateX(-90deg) translateZ(-52px)';

      setTimeout(() => {
        userB.el.style.transform = '';
        if (winners.length > 0) {
          userB.flashScored();
          winners.forEach(t => { if (t.currentCube) t.currentCube.flashScored(); });
        }

        this.switchPlayer();

        // 2. Announce Next Turn
        const nextPlayerName = this.config.players[this.currentPlayer].name;
        this.notify(`${nextPlayerName}'s Turn`, false);
      }, 200);
    }

    checkPoints() {
      const { x: col, y: row } = this.selected;
      const ply = this.currentPlayer;
      let contributors = [];

      const getTile = (r, c) => {
        const nR = row + r, nC = col + c;
        if (nR < 0 || nR >= this.config.rows || nC < 0 || nC >= this.config.cols) return null;
        const t = this.grid[nR][nC];
        return (t.element.placed && t.element.player === ply) ? t : null;
      };

      // Example Patterns (Horizontal, Vertical, Diagonals)
      const patterns = [
        [ [0,-1], [0,-2] ], [ [0,1], [0,2] ], // Horiz
        [ [1,0], [2,0] ], [ [-1,0], [-2,0] ], // Vert
        [ [1,1], [2,2] ], [ [-1,-1], [-2,-2] ], // Diag 1
        [ [1,-1], [2,-2] ], [ [-1,1], [-2,2] ], // Diag 2
        [ [0,-1], [0,1] ], [ [1,0], [-1,0] ]    // Middlers
      ];

      patterns.forEach(p => {
        const t1 = getTile(p[0][0], p[0][1]);
        const t2 = getTile(p[1][0], p[1][1]);
        if (t1 && t2) {
          contributors.push(t1, t2);
          this.config.players[ply].score++;
        }
      });

      this.updateUI();
      return contributors;
    }

    updateUI() {
      if (this.config.dom.scoreOne) {
        this.config.dom.scoreOne.innerHTML = this.config.players[1].score;
      }
      if (this.config.dom.scoreTwo) {
        this.config.dom.scoreTwo.innerHTML = this.config.players[2].score;
      }
    }

    switchPlayer() {
      this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;

      // If it's the bot's turn, trigger it
      if (this.isBotEnabled && this.currentPlayer === 2) {
        this.bot.takeTurn();
      }
    }
    /**
     * Optimized Camera via RequestAnimationFrame
     */
    onMouseDown(e) {
      if (e.which === 2) {
        this.mouse.x = e.clientX;
        this.mouse.y = e.clientY;
        this._moveRef = (ev) => this.handleMouseMove(ev);
        this._upRef = () => this.stopCamera();
        window.addEventListener('mousemove', this._moveRef);
        window.addEventListener('mouseup', this._upRef);
      }
    }

    handleMouseMove(e) {
      this.targetX = Math.min(Math.max(this.camera.degX + (this.mouse.y - e.clientY), 18), 90);
      this.targetY = Math.min(Math.max(this.camera.degY + (this.mouse.x - e.clientX), -45), 45);
      if (!this.ticking) {
        requestAnimationFrame(() => {
          this.config.dom.wrap.style.transform = `rotateX(${this.targetX}deg) rotateZ(${this.targetY}deg)`;
          this.ticking = false;
        });
        this.ticking = true;
      }
    }

    stopCamera() {
      window.removeEventListener('mousemove', this._moveRef);
      window.removeEventListener('mouseup', this._upRef);
      this.camera.degX = this.targetX;
      this.camera.degY = this.targetY;
    }
  }

  // Global Init
  const app = new GameEngine();

</script>

</html>
